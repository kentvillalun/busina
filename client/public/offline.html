<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0F2233" />
    <title>Busina is offline</title>
    <style>
      /* Plain CSS on purpose: this page is served from the cache, away from Next and Tailwind. */
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font-family: system-ui, sans-serif;
        background: #f4f8fb;
        color: #0f2233;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
      }
      html {
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: #4a5b6b;
      }
      button {
        margin-top: 12px;
        padding: 14px 28px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1f73bd;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      Busina needs a connection to show where your bus is. Check your signal and
      try again.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
